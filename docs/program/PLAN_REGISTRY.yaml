# Semantics for the fields below, fixed at owner review:
#
#   dependencies.declared_by_source
#     the source document itself names the dependency
#   dependencies.inferred_by_review
#     the bootstrap architect inferred it; weaker, and revisable
#
#   conflicts_with[].topics
#     conflicts are recorded at TOPIC level. A topic conflict does not make the
#     whole plan rejectable. Do not read "conflicts_with: X" as "X is wrong".
#
#   implementation_assessment
#     NOT_ASSESSED means nobody has checked how much of this plan already exists
#     in the repository. It does NOT mean "nothing is implemented".

# Cross-cutting requirements fixed by owner decision on 2026-08-06 (Wave 2 review).
# These bind every learner-facing plan, not one card.
standards:

  verifier_architecture:
    status: REQUIRED
    layers:
      - {id: 1, name: full reference verifier, scope: every start x every half-length}
      - {id: 2, name: append-only incremental, scope: violations ending at the new symbol}
      - {id: 3, name: changed-index verifier, scope: middle-cell edits, required_by: [PLAN-ABELISK-003]}
      - {id: 4, name: independent full verifier, scope: genuinely separate code path}
    rule: >
      The shared mathematical core must support the stronger Abelisk requirements.
      Tutorial functionality may use a strict subset. Do not build the core to the
      tutorial's append-only shape.

  accessibility_floor:
    status: REQUIRED
    applies_to: [PLAN-ABELISK-003, PLAN-EDU-001]
    minimum:
      - large interaction targets
      - full keyboard operation
      - no mandatory precision dragging
      - switch-compatible interaction where practical
      - alternative controls for drag or timed actions
      - reduced-motion support preserving all information

  pedagogical_claim_status:
    status: DESIGN_HYPOTHESES_ONLY
    detail: >
      There is currently no evidence that Abelisk or the tutorial produces the
      intended learning or transfer outcomes.
    required_wording_distinction:
      - intended learning outcome
      - design rationale
      - usability observation
      - measured learning result
    first_pilot_requirement:
      transfer_task: REQUIRED
      acceptable_forms:
        - a different alphabet
        - different symbols or colours
        - a novel pair of blocks
        - explaining why a finite example does not establish an infinite construction

  evidence_scales:
    # OD-12, decided 2026-08-06. R0-R5 must NOT be used for both meanings.
    status: REQUIRED
    reproducibility:
      prefix: REP
      range: [0, 5]
      measures: reproducibility and preservation
    independence:
      prefix: IND
      range: [0, 5]
      measures: verifier independence
    rule: >
      The two scores are reported separately. A result may have high reproducibility
      and weak independence, or the reverse. No combined score may hide the
      distinction. Wave 4 may propose exact level definitions but must not silently
      relabel material outside docs/program/.

  terminology_rulings:
    - term: "Veikko's rule / Veikon saanto"
      ruling: PROHIBITED_AS_CANONICAL_NAME
      use_instead: the project-specific FORBID4 set, or FORBID4 heuristic
      condition_for_change: a primary source establishing another attribution
      basis: [MATH_CLAIMS.md row 9, MATH_CLAIMS.md row 41]

  unverified_relationships:
    status: MUST_NOT_BECOME_PRODUCT_REQUIREMENTS
    items:
      - id: g85-master-85
        detail: the 85-cell Master concept remains CONDITIONAL until the relationship
                to Keranen's g85 (MATH_CLAIMS.md row 3) is verified
      - id: additive-0126
        detail: the mathematical status of the alphabet {0,1,2,6} must be checked
                against the affine-class sweep (MATH_CLAIMS.md row 54)
      - id: pedagogical-claim-ids
        detail: IDs such as DEF-ABELIAN-SQUARE-0001 must map to generated views of
                the canonical ledger and must never become a second claims authority
                (see OD-7)

