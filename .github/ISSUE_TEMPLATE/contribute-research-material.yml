name: "Contribute Research Material"
description: >-
  Share a word, dataset, tool, visualization, historical artifact, or lead
  with the Word Structures / Combinatorics on Words Research project.
title: "[Research Material] "
labels:
  - "research-material"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for offering material to this project. A few things before
        you start, so expectations are clear on both sides:

        - **You do not need to adapt this material to the repository's
          structure yourself.** Describe what you have and where it came
          from; if it's accepted, fitting it into the project's layout is
          the project's job, not yours.
        - **Submitting this form does not, by itself, make anything an
          accepted project claim.** `MATH_CLAIMS.md` remains the sole
          authority for every mathematical claim this project makes. A
          submission becomes a claim only after review, sourcing, and a
          merged ledger row — the same bar the project holds its own
          contributions to.
        - **Attribution is not the same thing as redistribution
          permission.** Telling us who created something, or where you
          found it, does not by itself establish that it may be
          redistributed from this repository. Please answer the rights
          questions below as accurately as you can, including "I don't
          know."
        - **Mathematical claims still go through the normal evidence and
          review process** described in `AGENTS.md` and `CONTRIBUTING.md` —
          citation before claim, two verification levels, calibrated
          language for finite results.

  - type: dropdown
    id: contribution-type
    attributes:
      label: Contribution type
      description: Which of these best describes what you're sharing?
      options:
        - Research evidence (a word, computation, or result)
        - Historical artifact (an old file, log, or record with provenance value)
        - Visualization
        - Educational material
        - Computational tool
        - Dataset
        - Research lead (a pointer, question, or literature reference — not the material itself)
        - Other
    validations:
      required: true

  - type: textarea
    id: what-is-it
    attributes:
      label: What is it?
      description: >-
        Describe the material in plain terms — what it is, its size or
        scope, and the format it's in.
      placeholder: >-
        e.g. "A 2,500-character ternary word avoiding abelian squares of
        period >= 2, generated by an exhaustive search."
    validations:
      required: true

  - type: input
    id: source-link
    attributes:
      label: Source / link
      description: >-
        A link to the material itself, or to where it currently lives
        (a repository, a paper, a personal page, a file you can attach
        to this issue). Leave blank if there is no link and you'll attach
        or paste the material directly.
      placeholder: https://
    validations:
      required: false

  - type: textarea
    id: provenance
    attributes:
      label: Provenance
      description: >-
        Where did this come from? Who produced it, when, and how, as far
        as you know? If you generated it yourself, say so — that's a
        complete and useful answer. "I'm not sure where this came from" is
        also an acceptable answer if it's true; a guess presented as fact
        is worse than an honest gap.
    validations:
      required: true

  - type: dropdown
    id: rights-status
    attributes:
      label: Rights / redistribution status
      description: >-
        As best you know, what is this material's rights status for the
        purpose of being tracked and redistributed from this public
        repository?
      options:
        - I created this myself and grant permission to include and redistribute it here
        - I hold clear rights and can grant redistribution permission (explain in the next field)
        - Third-party material — redistribution permission is NOT yet established
        - Public domain / no known rights restriction
        - Rights status unknown — needs to be traced before use
        - Not applicable (this is a pointer/lead only; nothing is being redistributed)
    validations:
      required: true

  - type: textarea
    id: rights-details
    attributes:
      label: Rights details / licence
      description: >-
        Any licence, attribution requirement, citation the source asks for,
        or context on how you know the rights status above. Leave blank if
        the dropdown answer above is self-explanatory.
    validations:
      required: false

  - type: dropdown
    id: research-status
    attributes:
      label: Mathematical / research status
      description: >-
        If this material carries a mathematical or empirical claim, how
        established is it? (If it doesn't carry a claim at all — a tool or
        purely educational material, for instance — choose the first option.)
      options:
        - Not a mathematical claim (tool, dataset without a stated result, educational material, etc.)
        - Preliminary / unverified hypothesis
        - Reproducible computation, not yet independently checked
        - Independently verified against a primary source
        - Already published / an established result (please give the citation above or below)
        - Not sure
    validations:
      required: false

  - type: textarea
    id: why-it-matters
    attributes:
      label: Why it may matter to Word Structures
      description: >-
        How does this connect to Mäkelä's conjecture, the project's other
        open questions, ABELISK, or the project's teaching mission? A short
        explanation is enough.
    validations:
      required: true

  - type: textarea
    id: suggested-use
    attributes:
      label: Suggested use
      description: >-
        What do you think should happen with this — a candidate
        `MATH_CLAIMS.md` row, an addition to the archive, a new tool, a
        teaching example, something else? Your suggestion is not binding;
        it just helps the first review.
    validations:
      required: false

  - type: textarea
    id: verification-notes
    attributes:
      label: Verification / reproducibility notes
      description: >-
        Anything that would help someone independently check this: the
        exact command or method used, parameters, seeds, expected output,
        or a note that no independent check has been done yet.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you submit
      options:
        - label: >-
            I understand this submission does not automatically become an
            accepted claim, and that mathematical claims go through the
            project's normal evidence and review process before any
            `MATH_CLAIMS.md` row is written.
          required: true
        - label: >-
            I understand that attribution (naming a source or author) is
            not the same as confirmed redistribution permission, and I
            have answered the rights questions above as accurately as I
            can.
          required: true
